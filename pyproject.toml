[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcb-emu"
version = "0.1.0"
description = "Copper-derived PCB emulator with Python component models"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "shapely>=2.0"]
license = "MIT"

[project.optional-dependencies]
gpu = ["torch>=2.2", "cupy-cuda12x>=13"]
kicad = [] # Install pcbnew with KiCad; it is not distributed on PyPI.
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pcb_emu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
